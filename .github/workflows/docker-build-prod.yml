name: Build and Push Docker Image (Prod)

# 1. Penetapan bila workflow ini akan jalan
on:
  push:
    branches:
      - 'prod'  # Akan jalan bila ada 'git push' ke branch 'prod'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 2. Salin (checkout) semua kod dari branch 'prod'
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. Persediaan BuildKit untuk prestasi lebih baik
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log masuk ke Docker Hub guna kredensial yang disimpan tadi
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Bina dan terus push image ke Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .  # Lokasi Dockerfile adalah di root direktori repo
          push: true  # Arahan untuk push image selepas bina
          
          # Tag untuk image di Docker Hub: username/nama-repo:prod
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/filesender:prod
            ${{ secrets.DOCKERHUB_USERNAME }}/filesender:latest
